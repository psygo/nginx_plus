<svg xmlns="http://www.w3.org/2000/svg" width="760" height="338" viewBox="0 0 760 338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="338" rx="8" fill="#fcfcfb"/><text x="24.0" y="30.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">Routing by learned request cost</text><text x="24.0" y="52.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Least outstanding work, with route costs and server speeds learned from response times,</text><text x="24.0" y="70.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">vs being told them. p99 vs patched least_time; 3 workloads (up to 50 routes), 70 and 85 % load.</text><circle cx="29.0" cy="94.0" r="6.5" fill="#fcfcfb"/><circle cx="29.0" cy="94.0" r="4.5" fill="#eb6834" stroke="#eb6834" stroke-width="0"/><text x="40.0" y="98.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">told each request's cost and each server's capacity</text><circle cx="434.2" cy="94.0" r="6.5" fill="#fcfcfb"/><circle cx="434.2" cy="94.0" r="4.5" fill="#2a78d6" stroke="#2a78d6" stroke-width="0"/><text x="445.2" y="98.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">learned from response times (no hint)</text><line x1="190.0" y1="120.0" x2="190.0" y2="286.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="round"/><text x="190.0" y="303.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">−60 %</text><line x1="360.0" y1="120.0" x2="360.0" y2="286.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="round"/><text x="360.0" y="303.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">−40 %</text><line x1="530.0" y1="120.0" x2="530.0" y2="286.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="round"/><text x="530.0" y="303.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">−20 %</text><line x1="700.0" y1="120.0" x2="700.0"